<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蝦皮優惠區</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: "Microsoft JhengHei", sans-serif;
    background: #0d0d0d;
    color: #ffffff;
}

header {
    text-align: center;
    padding: 25px 15px;
    background: linear-gradient(135deg,#1e90ff,#00bfff); /* 標題藍色漸層 */
    font-size: 22px;
    font-weight: bold;
}

/* 區塊 */
.section {
    padding: 25px 20px;
}

.section h2 {
    border-left: 5px solid #ff4dc4; /* 保持粉色側邊條 */
    padding-left: 10px;
    margin-bottom: 20px;
}

/* 折扣區 */
.coupon-box {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 20px; /* 增加兩個方格之間的距離 */
}

/* 將原本 coupon-box 的樣式拆分，文字顏色改為藍色 */
.coupon-title {
    font-size: 18px;
    margin-bottom: 15px;
    color: #00bfff; /* 折扣標題改為藍色 */
}

/* 按鈕樣式修改：預設為藍色漸層 */
.coupon-btn {
    background: linear-gradient(135deg,#1e90ff,#00bfff); /* 按鈕藍色漸層 */
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    width: 100%; /* 讓按鈕填滿方格寬度 */
    box-sizing: border-box;
}

/* 滑鼠移到按鈕上的效果（改為深藍色） */
.coupon-btn:hover {
    background: #007acc; 
}

/* 社群 ICON */
.social-icons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 15px;
}

.social-icons a {
    font-size: 32px;
    color: #ff4dc4; /* 保持社群圖示粉色 */
    transition: 0.3s;
}

.social-icons a:hover {
    color: #8a2be2; /* 滑鼠移到社群圖示變色 */
    transform: scale(1.2);
}
</style>
</head>

<body>

<header>
蝦皮優惠區
</header>

<!-- 折扣碼 -->
<div class="section">
<h2>限時折扣碼</h2>

<!-- 第一個方格 -->
<div class="coupon-box">
    <div class="coupon-title">全館滿100折20</div>
    <button class="coupon-btn" onclick="claimCoupon()">點擊領取會自動複製折扣碼</button>
</div>

<!-- 第二個方格 -->
<div class="coupon-box">
    <div class="coupon-title">粉絲專屬碼</div>
    <button class="coupon-btn" onclick="claimCoupon2()">點擊領取隱藏優惠</button>
</div>

</div>

<!-- 社群連結 -->
<div class="section">
<h2>社群連結</h2>

<div class="social-icons">
<a href="#">
    <i class="fa-brands fa-line"></i>
</a>
<a href="#">
    <i class="fa-brands fa-instagram"></i>
</a>
<a href="#">
    <i class="fa-brands fa-threads"></i>
</a>
</div>

</div>

<script>
function claimCoupon(){
    // 這是範例折扣碼，請替換成你實際要發的碼
    navigator.clipboard.writeText("FEBSHV25");
    // 這是範例連結，請替換成你的蝦皮商品連結或賣場連結
    window.location.href = "https://s.shopee.tw/807OEa1Na1";
}

function claimCoupon2(){
    // 這是範例折扣碼，請替換成你實際要發的碼
    navigator.clipboard.writeText("NANA99"); 
    // 這是範例連結，請替換成你的蝦皮商品連結或賣場連結
    window.location.href = "https://s.shopee.tw/807OEa1Na1";
}
</script>

</body>
</html>
